name: Build and Push
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  migrate:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef
      - name: Restore
        run: dotnet restore
      - name: Generate idempotent migration script
        run: |
          dotnet ef migrations script \
            --idempotent \
            --project src/HouseOfNaksh.Infrastructure \
            --startup-project src/HouseOfNaksh.Infrastructure \
            --output migrations.sql
          echo "----- SQL to be applied -----"
          cat migrations.sql
          echo "-----------------------------"
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Open firewall for runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          az sql server firewall-rule create \
            --resource-group ${{ vars.SQL_RESOURCE_GROUP }} \
            --server ${{ vars.SQL_SERVER_NAME }} \
            --name "gh-runner-${{ github.run_id }}" \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP
      - name: Apply migrations
        run: |
          sqlcmd -C -b \
            -S tcp:${{ vars.SQL_SERVER_NAME }}.database.windows.net,1433 \
            -d ${{ vars.SQL_DATABASE_NAME }} \
            -U hondbadmin \
            -P '${{ secrets.SQL_ADMIN_PASSWORD }}' \
            -i migrations.sql
      - name: Close firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ vars.SQL_RESOURCE_GROUP }} \
            --server ${{ vars.SQL_SERVER_NAME }} \
            --name "gh-runner-${{ github.run_id }}" \
            || true
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Container Apps
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}:${TAG}"
          echo "Deploying $IMAGE"
          az containerapp update \
            --name ${{ vars.CONTAINER_APP }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image "$IMAGE"
